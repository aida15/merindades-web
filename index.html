<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Merindades: arte y cultura</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3eee6; color: #1f1a15;
           font-family: Georgia, "Times New Roman", serif; padding: 24px; box-sizing: border-box; }
    main { max-width: 520px; width: 100%; }
    h1 { font-size: 2.2rem; margin: 0 0 .3rem; }
    p { font-family: system-ui, sans-serif; color: #4a4036; margin: 0 0 2rem; }
    nav { display: grid; gap: 12px; }
    a { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 18px 22px;
        background: #fff; border-radius: 16px; text-decoration: none; color: inherit; box-shadow: 0 4px 14px rgba(31,26,21,.1); }
    a:hover, a:focus-visible { outline: 3px solid #7a2e2a; }
    .pueblo { font-size: 1.5rem; font-weight: 700; }
    .iglesia { font-family: system-ui, sans-serif; color: #85601f; font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <h1>Merindades: arte y cultura</h1>
    <p>Versión de revisión de las pantallas táctiles. Elige una iglesia.</p>
    <nav>
      <a href="salazar/"><span class="pueblo">Salazar</span><span class="iglesia">Iglesia de Santa María</span></a>
      <a href="puentedey/"><span class="pueblo">Puentedey</span><span class="iglesia">Iglesia de Puentedey</span></a>
      <a href="campo/"><span class="pueblo">Campo</span><span class="iglesia">Iglesia de Campo</span></a>
      <a href="escano/"><span class="pueblo">Escaño</span><span class="iglesia">Iglesia del Salvador</span></a>
    </nav>
  </main>
</body>
</html>
